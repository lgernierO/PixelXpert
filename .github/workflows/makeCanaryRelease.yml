name: Make Canary Release

on:
  push:
    branches:
      - 'canary'
      - 'adapt/latest-systemui-launcher'
    paths:
      - '.github/edit2MakeNewCanary'
      - '.github/workflows/makeCanaryRelease.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'adapt/latest-systemui-launcher'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Source Code Download (branch push)
      if: github.event_name == 'push'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        submodules: recursive
        fetch-depth: 0

    - name: Source Code Download (manual branch build)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        submodules: recursive
        fetch-depth: 0
      
    - name: JDK 25 Setup
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: temurin
        cache: gradle
    - name: Java Version
      run: java --version

    - name: Gradlew Permissions
      run: chmod +x gradlew

    - name: Signature files preparation
      run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> ReleaseKey.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> ReleaseKey.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> ReleaseKey.properties
            echo storeFile='${{ github.workspace }}/ReleaseKey.jks' >> ReleaseKey.properties
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > ${{ github.workspace }}/ReleaseKey.jks
          fi
      
    - name: Build Zygisk libraries (LSPlant)
      run: |
          set -euo pipefail
          NDK_DIR=""
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -1)
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "NDK not found"
            exit 1
          fi
          TC="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cmake "$TC/cmake" 2>/dev/null || true
          # NDK ships its own cmake/ninja
          CMAKE_BIN="$NDK_DIR"/toolchains/llvm/prebuilt/linux-x86_64/bin
          if [ ! -x "$CMAKE_BIN/cmake" ]; then CMAKE_BIN=""; fi
          ZSRC=zygisk/src
          OUT=MagiskModBase/zygisk
          mkdir -p "$OUT" "$ZSRC/build-a64" "$ZSRC/build-arm"
          for ABI in a64 arm; do
            if [ "$ABI" = "a64" ]; then A=arm64-v8a; T=aarch64-linux-android24; else A=armeabi-v7a; T=armv7a-linux-androideabi24; fi
            (cd "$ZSRC/build-$ABI" && \
             ${CMAKE_BIN:+$CMAKE_BIN/}cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
               -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
               -DANDROID_ABI=$A -DANDROID_PLATFORM=android-24 \
               -DCMAKE_C_COMPILER_LAUNCHER="" -DANDROID_NDK="$NDK_DIR" .. && \
             ${CMAKE_BIN:+$CMAKE_BIN/}ninja pixelxpert_zygisk && \
             "$TC/llvm-strip" --strip-all libpixelxpert_zygisk.so && \
             cp -v libpixelxpert_zygisk.so "../../../$OUT/$A.so")
          done
          file "$OUT"/*

    - name: Build sqlite3 (NDK, latest from sqlite.org)
      run: |
          set -euo pipefail
          NDK_DIR=""
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -1)
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "NDK not found"
            exit 1
          fi
          TC="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          PAGE=$(curl -fsSL --max-time 60 https://www.sqlite.org/download.html)
          REL=$(echo "$PAGE" | grep -oP '[0-9]{4}/sqlite-amalgamation-[0-9]+\.zip' | head -1)
          if [ -z "$REL" ]; then
            echo "Failed to resolve latest sqlite version"
            exit 1
          fi
          VER=$(echo "$REL" | grep -oP 'sqlite-amalgamation-\K[0-9]+')
          VMAJ=$((10#$VER / 1000000)); VMID=$(( (10#$VER / 1000) % 1000 )); VMIN=$((10#$VER % 1000))
          echo "Latest sqlite: $VMAJ.$VMID.$VMIN (https://www.sqlite.org/$REL)"
          curl -fsSL --max-time 120 -o sqlite-amalgamation.zip "https://www.sqlite.org/$REL"
          rm -rf sqlite-src && mkdir sqlite-src && cd sqlite-src
          unzip -q ../sqlite-amalgamation.zip
          cd sqlite-amalgamation-*
          $TC/aarch64-linux-android21-clang \
            -O2 -DSQLITE_THREADSAFE=1 -DHAVE_USLEEP=1 \
            -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_RTREE \
            -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_COLUMN_METADATA \
            sqlite3.c shell.c -o ../sqlite3 -ldl -lm
          cd ..
          $TC/llvm-strip --strip-all sqlite3
          file sqlite3
          # the built binary is ARM, it cannot run on the x86 runner, so read the version from it
          strings sqlite3 | grep -m1 -E "[0-9]+\.[0-9]+\.[0-9]+" || true
          cp -v sqlite3 "$GITHUB_WORKSPACE/MagiskModBase/sqlite3"

    - name: Gradle Build
      run: ./gradlew buildCanary -Pchannel=canary

    - name: Shell Scripts Permissions
      if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
      run: chmod +x .github/*.sh

    - name: Changelog Generation
      if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
      run: .github/extractCanaryChanges.sh

    - name: Version Bump
      if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
      run: .github/prepareCanaryChangelog.sh ${{ github.run_id }}

    - name: Upload Directly Flashable Artifact to Actions
      uses: actions/upload-artifact@v7
      with:
        name: PixelXpert.zip
        path: output/PixelXpert.zip
        archive: false
        if-no-files-found: error

    - name: Canary Binary Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
      uses: ncipollo/release-action@v1
      with:
        tag: 'canary_builds'
        name: 'Latest Canary'
        omitBodyDuringUpdate: true
        prerelease: true
        allowUpdates: true
        replacesArtifacts: true
        draft: false
        artifacts: 'output/*.*'

    - name: Version Bump Commit
      if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git config user.name GitHub
        git config user.email PixelXpert@siava.sh
        git add -- MagiskModBase/module.prop version.properties latestVersion.json CanaryChangelog.md latestCanary.json MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Full.json
        if git diff --cached --quiet; then
          exit 0
        fi
        git commit -m 'Version update: Release'
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git push origin HEAD:canary

