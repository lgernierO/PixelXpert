name: Make Canary Release

on:
  push:
    branches:
      - 'canary'
    paths:
      - '.github/edit2MakeNewCanary'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'adapt/latest-systemui-launcher'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Source Code Download
      if: github.event_name == 'push'
      run: git clone --branch canary --single-branch --recurse-submodules https://github.com/siavash79/PixelXpert.git .

    - name: Source Code Download (manual branch build)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.ref }}
        submodules: recursive
        fetch-depth: 0
      
    - name: JDK 21 Setup
      uses: actions/setup-java@v5.6.0
      with:
        java-version: '21'
        distribution: 'jetbrains'
        cache: gradle

    - name: Gradlew Permissions
      run: chmod +x gradlew

    - name: Signature files preparation
      run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> ReleaseKey.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> ReleaseKey.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> ReleaseKey.properties
            echo storeFile='${{ github.workspace }}/ReleaseKey.jks' >> ReleaseKey.properties
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > ${{ github.workspace }}/ReleaseKey.jks
          fi
      
    - name: Gradle Build
      run: ./gradlew buildCanary -Pchannel=canary

    - name: Shell Scripts Permissions
      if: github.event_name == 'push'
      run: chmod +x .github/*.sh

    - name: Changelog Generation
      if: github.event_name == 'push'
      run: .github/extractCanaryChanges.sh

    - name: Version Bump
      if: github.event_name == 'push'
      run: .github/prepareCanaryChangelog.sh ${{ github.run_id }}

    - name: Prepare Directly Flashable Actions Artifact
      shell: bash
      run: |
        set -euo pipefail
        module_zip="output/PixelXpert.zip"
        test -f "$module_zip"
        rm -rf actions-artifact
        mkdir -p actions-artifact
        unzip -q "$module_zip" -d actions-artifact
        test -f actions-artifact/module.prop
        test -f actions-artifact/customize.sh
        test -d actions-artifact/META-INF
        ! find actions-artifact -maxdepth 1 -type f -name '*.zip' -print -quit | grep -q .

    - name: Upload Directly Flashable Artifact to Actions
      uses: actions/upload-artifact@v7.0.1
      with:
        # GitHub adds the single download ZIP layer. Its root is the Magisk
        # module itself, rather than a ZIP containing another module ZIP.
        name: PixelXpert
        path: actions-artifact/*
        if-no-files-found: error
        include-hidden-files: true

    - name: Canary Binary Release
      if: github.event_name == 'push'
      uses: ncipollo/release-action@v1.21.0
      with:
        tag: 'canary_builds'
        name: 'Latest Canary'
        omitBodyDuringUpdate: true
        prerelease: true
        allowUpdates: true
        replacesArtifacts: true
        draft: false
        artifacts: 'output/*.*'

    - name: Version Bump Commit
      if: github.event_name == 'push'
      uses: github-actions-x/commit@v2.9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        push-branch: 'canary'
        commit-message: 'Version update: Release'
        force-add: 'true'
        files: MagiskModBase/module.prop version.properties latestVersion.json CanaryChangelog.md latestCanary.json MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Full.json
        name: GitHub
        email: PixelXpert@siava.sh
