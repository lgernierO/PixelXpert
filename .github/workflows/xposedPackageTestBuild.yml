name: Make Xposed Test Package

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
        
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant permission shell scripts
        run: chmod +x .github/*.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build

      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK

        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "33.0.0"
          
      - name: Magisk Module Generation
        run: .github/make_debug_zip.sh

      - name: Upload APK file
        uses: actions/upload-artifact@v7
        with:
          name: PixelXpert_Xposed.apk
          path: ${{steps.sign_app.outputs.signedReleaseFile}}
          archive: false
          if-no-files-found: error
        
      - name: Upload Xposed Artifact to Actions
        uses: actions/upload-artifact@v7
        with: 
          name: PixelXpert_Xposed.zip
          path: output/PixelXpert.zip
          archive: false
          if-no-files-found: error
