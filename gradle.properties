#Thu Mar 17 21:09:57 IRST 2022
android.injected.testOnly=false
org.gradle.jvmargs=-Xmx1536M -Dkotlin.daemon.jvm.options\="-Xmx1536M" -Dfile.encoding\=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
#createZip's doFirst references Gradle script objects, which the configuration cache
#cannot serialize (fails buildCanary at the packaging step). Disable it: a one-shot
#Canary release build does not benefit from the configuration cache.
org.gradle.configuration-cache=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false